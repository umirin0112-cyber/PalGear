<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>パルギア</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body>
    <main class="app">
      <section class="top-area">
        <div class="counter-panel">
          <div class="counter-main">
            <div class="counter-icon">❤️</div>
            <div id="hpValue" class="counter-value">10</div>
          </div>

          <div class="counter-action-area">
            <div class="counter-buttons">
              <button id="hpMinus" class="minus-red">-1</button>
              <button id="hpPlus" class="plus-green">+1</button>
            </div>
          </div>
        </div>

        <div class="counter-panel">
          <div class="counter-main">
            <div class="counter-icon">🥖</div>
            <div id="foodValue" class="counter-value">0</div>
          </div>

          <div class="counter-action-area">
            <div class="counter-buttons">
              <button id="foodMinus" class="minus-red">-1</button>
              <button id="foodPlus" class="plus-green">+1</button>
            </div>
          </div>
        </div>

        <div class="counter-panel">
          <div class="counter-main">
            <div class="counter-icon">🪵</div>
            <div id="materialValue" class="counter-value">0</div>
          </div>

          <div class="counter-action-area">
            <div class="counter-buttons">
              <button id="materialMinus" class="minus-red">-1</button>
              <button id="materialPlus" class="plus-green">+1</button>
            </div>
          </div>
        </div>
      </section>

      <section class="bottom-area">
        <div class="soul-deck-panel">
          <button id="soulDrawButton" class="soul-draw-button">
            ソウルを追加
          </button>

          <button id="soulReturnButton" class="soul-return-button">
            戻す
          </button>
        </div>

        <div class="soul-zone-panel">
          <div class="soul-count-panel">
            <div class="soul-icon">🔥</div>
            <div id="soulCount" class="soul-count">0/0</div>
          </div>

          <div id="soulZone" class="soul-zone"></div>
        </div>

        <div class="soul-action-panel">
          <button id="spendSoulButton" class="spend-soul-button">
            レスト
          </button>

          <button id="standSoulButton" class="stand-soul-button">
            スタンド
          </button>

          <button id="turnStartButton" class="turn-start-button">
            ターン開始
          </button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
